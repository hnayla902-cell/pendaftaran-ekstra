<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Extracurricular</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <div class="left">
        <div class="logo">✦</div>

        <h1>Join<br></h1> <h2>Ekstrakulikuler SMKN Tengaran.</h2>

        <p>
            Temukan kegiatan yang kamu suka,
            kembangkan bakat, dan dapatkan
            pengalaman baru bersama kami.
        </p>

    </div>

    <div class="right">

        <h2>Registration Form</h2>
        <p class="sub">Daftar menjadi anggota ekstrakurikuler</p>

        <form id="formPendaftaran">

            <div class="form-grid">

                <div class="input-box">
                    <label>Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Nama lengkap">
                    <small id="errorNama"></small>
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="nama@email.com">
                    <small id="errorEmail"></small>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Minimal 8 karakter">
                    <small id="errorPassword"></small>
                </div>

                <div class="input-box">
                    <label>Konfirmasi Password</label>
                    <input type="password" id="konfirmasi" placeholder="Ulangi password">
                    <small id="errorKonfirmasi"></small>
                </div>

                <div class="input-box full">
                    <label>Pilih Ekstrakurikuler</label>
                    <select id="ekskul">
                        <option value="">-- Pilih ekstrakurikuler --</option>
                        <option value="Pramuka">Pramuka</option>
                        <option value="Paskibra">Paskibra</option>
                        <option value="Osis">Osis</option>
                        <option value="PMR">PMR</option>
                        <option value="Rohis">Rohis</option>
                        <option value="PaduanSuara">Paduan suara</option>
                        <option value="Jurnalis">Jurnalis</option>
                        <option value="BahasaJepang">Bahasa Jepang</option>
                        <option value="PencakSilat">Pencak Silat</option>
                        <option value="Drumband">Drumband</option>
                        <option value="Rebana">Rebana</option>
                        <option value="Tari">Tari</option>
                    </select>
                    <small id="errorEkskul"></small>
                </div>

            </div>

            <button type="submit">Create Account ✦</button>

            <p id="pesan"></p>

        </form>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
